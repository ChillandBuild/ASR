[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglish-asr-research"
version = "0.1.0"
description = "Reproducible local Tanglish ASR pilot with immutable source provenance"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
asr = ["openai-whisper==20250625"]

[project.scripts]
tanglish-asr = "tanglish_asr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
